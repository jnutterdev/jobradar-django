[project]
name = "jobradar-django"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "python-frontmatter>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]

[tool.basedpyright]
extraPaths = ["scripts"]
typeCheckingMode = "standard"
